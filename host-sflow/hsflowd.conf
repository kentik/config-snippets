# /etc/hsflowd.conf
# Host sFlow -> Kentik / kproxy / kflow collector

sflow {
  # Agent address: use the stable management/source IP of this host
  agent = {{ AGENT_IP }}

  # Kentik collector, usually your local kproxy/kflow receiver
  collector {
    # The IP address of the Kentik collector. This is usually the IP of your kproxy/UA receiver.
    ip = {{ COLLECTOR_IP }}
    # hsflowd defaults to 6343, but Kentik uses 9995 for kproxy/UA and 20013 for SaaS. 
    udpport = {{ COLLECTOR_PORT | default: 6343 }}
  }

  # Counter polling interval in seconds
  # set to 0 to disable as Kentik ignores them.
  polling = 0

  # Packet sampling rate
  # Good starting points:
  # 1G:    1024 or 2048
  # 10G:   4096 or 8192
  # 25G+:  8192, 16384, or higher
  sampling = {{ SAMPLING_RATE | default: 4096 }}

  # Optional: explicitly monitor interfaces.
  # If omitted, hsflowd usually discovers interfaces automatically.
  # interface = eth0
  # interface = bond0
  # interface = br0
}